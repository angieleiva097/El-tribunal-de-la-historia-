<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>El Tribunal de la Historia</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="cabecera">
    <h1>EL TRIBUNAL DE LA HISTORIA</h1>
  </header>

  <p class="instruccion">
    Bienvenido al tribunal. Selecciona un icono para consultar los archivos históricos.
  </p>

  <main>

    <section class="escenario">

      <!-- IMAGEN DEL JUZGADO -->
      <img
        src="Juzgado.jpeg"
        class="fondo-juzgado"
        alt="Ilustración del juzgado"
        onerror="this.onerror=null; this.src='juzgado.jpeg';"
      >

      <!-- JUEZ: BIBLIOTECA -->
      <a
        href="expediente.html?personaje=biblioteca"
        class="icono juez"
        title="Biblioteca histórica"
        aria-label="Abrir biblioteca histórica"
      >⚖</a>

      <!-- SECRETARIO: ARCHIVO -->
      <a
        href="expediente.html?personaje=secretaria"
        class="icono secretario"
        title="Archivo del secretario"
        aria-label="Abrir archivo del secretario"
      >📜</a>

      <!-- FISCALÍA LIBERAL -->

      <a
        href="expediente.html?personaje=gaitan"
        class="icono gaitan"
        title="Jorge Eliécer Gaitán"
        aria-label="Expediente de Jorge Eliécer Gaitán"
      >📁</a>

      <a
        href="expediente.html?personaje=galan"
        class="icono galan"
        title="Luis Carlos Galán"
        aria-label="Expediente de Luis Carlos Galán"
      >📁</a>

      <a
        href="expediente.html?personaje=samper"
        class="icono samper"
        title="Ernesto Samper"
        aria-label="Expediente de Ernesto Samper"
      >📁</a>

      <!-- DEFENSA CONSERVADORA -->

      <a
        href="expediente.html?personaje=misael"
        class="icono misael"
        title="Misael Pastrana"
        aria-label="Expediente de Misael Pastrana"
      >📁</a>

      <a
        href="expediente.html?personaje=andres"
        class="icono andres"
        title="Andrés Pastrana"
        aria-label="Expediente de Andrés Pastrana"
      >📁</a>

      <a
        href="expediente.html?personaje=belisario"
        class="icono belisario"
        title="Belisario Betancur"
        aria-label="Expediente de Belisario Betancur"
      >📁</a>

    </section>

    <section class="leyenda">
      <span>FISCALÍA LIBERAL</span>
      <span>DEFENSA CONSERVADORA</span>
    </section>

  </main>

  <footer>
    <p>EL TRIBUNAL DE LA HISTORIA</p>
    <p>Investigar · Cuestionar · Debatir</p>
  </footer>

</body>
</html>
