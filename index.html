
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Tribunal de la Historia</title>
  <link rel="stylesheet" href="style.css?v=21">
</head>
<body>

  <header class="cabecera">
    <h1>EL TRIBUNAL DE LA HISTORIA</h1>
  </header>

  <p class="instruccion">
    Bienvenido al tribunal. Selecciona un expediente
    para investigar la historia política colombiana.
  </p>

  <main>
    <section class="escenario" aria-label="Sala del tribunal">

      <img
        src="juzgado.jpeg"
        class="fondo-juzgado"
        alt="Sala de El Tribunal de la Historia"
        onerror="this.onerror=null;this.src='Juzgado.jpeg';"
      >

      <!-- JUEZ -->
      <a class="icono juez"
         href="expediente.html?personaje=biblioteca"
         title="Biblioteca histórica"
         aria-label="Abrir biblioteca histórica">⚖</a>

      <!-- SECRETARIO -->
      <a class="icono secretario"
         href="expediente.html?personaje=secretaria"
         title="Archivo del secretario"
         aria-label="Abrir secretaría">📜</a>

      <!-- FISCALÍA LIBERAL -->
      <a class="icono gaitan"
         href="expediente.html?personaje=gaitan"
         title="Jorge Eliécer Gaitán">📁</a>

      <a class="icono galan"
         href="expediente.html?personaje=galan"
         title="Luis Carlos Galán">📁</a>

      <a class="icono samper"
         href="expediente.html?personaje=samper"
         title="Ernesto Samper">📁</a>

      <!-- DEFENSA CONSERVADORA -->
      <a class="icono misael"
         href="expediente.html?personaje=misael"
         title="Misael Pastrana">📁</a>

      <a class="icono andres"
         href="expediente.html?personaje=andres"
         title="Andrés Pastrana">📁</a>

      <a class="icono belisario"
         href="expediente.html?personaje=belisario"
         title="Belisario Betancur">📁</a>

    </section>

    <section class="leyenda">
      <span>FISCALÍA LIBERAL</span>
      <span>DEFENSA CONSERVADORA</span>
    </section>
  </main>

  <footer>
    EL TRIBUNAL DE LA HISTORIA
    <p>Investigar · Cuestionar · Debatir</p>
  </footer>

  <!-- AUDIO DE LA SALA -->
  <audio id="musicaTribunal"
         src="musica-tribunal.mp3"
         loop preload="none"></audio>

  <audio id="sonidoExpediente"
         src="expediente.mp3"
         preload="none"></audio>

  <audio id="sonidoMazo"
         src="mazo.mp3"
         preload="none"></audio>

  <button id="botonMusica"
          type="button"
          aria-pressed="false">
    🔊 Activar música
  </button>

  <script src="sonidos.js"></script>
</body>
</html>
