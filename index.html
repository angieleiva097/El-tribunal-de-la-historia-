<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Tribunal de la Historia</title>
  <link rel="stylesheet" href="style.css?v=20">
</head>

<body>

  <header class="cabecera">
    <h1>EL TRIBUNAL DE LA HISTORIA</h1>
  </header>

  <p class="instruccion">
    Bienvenido al tribunal. Selecciona un expediente para investigar y debatir.
  </p>

  <main>
    <section class="escenario">

      <img
        src="juzgado.jpeg"
        class="fondo-juzgado"
        alt="Sala de El Tribunal de la Historia"
        onerror="this.onerror=null;this.src='Juzgado.jpeg';"
      >

      <!-- JUEZ: BIBLIOTECA -->
      <a class="icono juez"
         href="expediente.html?personaje=biblioteca"
         title="Biblioteca histórica"
         aria-label="Biblioteca histórica">⚖</a>

      <!-- SECRETARIO: ARCHIVO -->
      <a class="icono secretario"
         href="expediente.html?personaje=secretaria"
         title="Archivo del secretario"
         aria-label="Archivo del secretario">📜</a>

      <!-- FISCALÍA LIBERAL -->
      <a class="icono gaitan"
         href="expediente.html?personaje=gaitan"
         title="Jorge Eliécer Gaitán"
         aria-label="Expediente de Gaitán">📁</a>

      <a class="icono galan"
         href="expediente.html?personaje=galan"
         title="Luis Carlos Galán"
         aria-label="Expediente de Galán">📁</a>

      <a class="icono samper"
         href="expediente.html?personaje=samper"
         title="Ernesto Samper"
         aria-label="Expediente de Samper">📁</a>

      <!-- DEFENSA CONSERVADORA -->
      <a class="icono misael"
         href="expediente.html?personaje=misael"
         title="Misael Pastrana"
         aria-label="Expediente de Misael Pastrana">📁</a>

      <a class="icono andres"
         href="expediente.html?personaje=andres"
         title="Andrés Pastrana"
         aria-label="Expediente de Andrés Pastrana">📁</a>

      <a class="icono belisario"
         href="expediente.html?personaje=belisario"
         title="Belisario Betancur"
         aria-label="Expediente de Belisario Betancur">📁</a>

    </section>

    <section class="leyenda">
      <span>FISCALÍA LIBERAL</span>
      <span>DEFENSA CONSERVADORA</span>
    </section>
  </main>

  <footer>
    EL TRIBUNAL DE LA HISTORIA
    <p>Investigar · Cuestionar · Debatir</p>
  </footer>

</body>
</html>
